<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Orix Global — Koreada GRANT asosida o'qish vebinari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-0:#0d0d10;
    --ink-1:#54525c;
    --ink-2:#918f99;
    --paper:#ffffff;
    --pill-gray:#f0eff3;
    --red-1:#ff3b30;
    --red-2:#c81e2e;
    --border:#ececf1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; overscroll-behavior:none; }
  body{
    font-family:'Manrope', sans-serif;
    background:var(--paper);
    color:var(--ink-0);
    min-height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  h1,.display{ font-family:'Space Grotesk', sans-serif; }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand-mark{ width:28px; height:28px; flex-shrink:0; }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .brand-name{ font-family:'Space Grotesk'; font-weight:700; font-size:14px; color:var(--ink-0); }
  .live{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--ink-1); letter-spacing:0.5px; }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background:var(--red-1);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,59,48,0.5); }
    70%{ box-shadow:0 0 0 7px rgba(255,59,48,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,59,48,0); }
  }

  main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 22px;
    gap:1.1vh;
    min-height:0;
  }

  .pill-row{ display:flex; gap:8px; justify-content:center; }
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:clamp(11px,3vh,13.5px); font-weight:700;
    padding:8px 15px; border-radius:100px;
  }
  .pill-date{ background:var(--pill-gray); color:var(--ink-0); }
  .pill-free{ background:#ffe3e0; color:var(--red-2); }

  h1{
    font-size:clamp(20px, 5vh, 32px);
    font-weight:700;
    line-height:1.14;
    letter-spacing:-0.7px;
    color:var(--ink-0);
  }
  .headline-outcome{
    font-family:'Space Grotesk';
    font-size:clamp(20px, 5vh, 32px);
    font-weight:700;
    line-height:1.14;
    letter-spacing:-0.7px;
    color:var(--red-1);
  }
  .social-proof{
    font-size:clamp(12px,2.6vh,14px); color:var(--ink-1); font-weight:600;
  }

  .urgency-chip{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--pill-gray);
    border-radius:100px; padding:9px 16px;
    font-size:clamp(12px,2.6vh,14px); font-weight:700; color:var(--ink-0);
  }
  .urgency-chip b{ font-family:'Space Grotesk'; color:var(--red-1); font-variant-numeric:tabular-nums; }

  .cta-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; max-width:420px;
    background:linear-gradient(90deg, var(--red-2), var(--red-1));
    color:#fff; font-weight:700; font-size:clamp(15px,3.4vh,18px);
    padding:clamp(14px,3vh,18px) 20px; border-radius:16px;
    box-shadow:0 14px 30px rgba(200,30,46,0.32);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta-btn:hover{ transform:translateY(-2px); }
  .cta-btn:active{ transform:translateY(0px) scale(0.98); }

  footer{
    text-align:center; padding:8px 20px;
    font-size:10px; color:var(--ink-2);
    flex-shrink:0;
  }

  .program-row{
    display:flex; flex-wrap:wrap; gap:7px;
    justify-content:center; max-width:360px;
  }
  .program-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--pill-gray); color:var(--ink-0);
    font-size:clamp(11px,2.4vh,12.5px); font-weight:700;
    padding:7px 12px; border-radius:100px;
    white-space:nowrap;
  }
</style>
</head>
